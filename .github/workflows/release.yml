name: AegisNode Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  trivy-security-scan:
    name: Trivy Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner on Source & Dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  build-and-release:
    name: Build, Scan & Publish Release (${{ matrix.target }})
    needs: trivy-security-scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    permissions:
      contents: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web UI static assets
        run: |
          cd web
          npm ci
          npm run build

      - name: Install Protobuf Compiler & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Rust Cache Optimization
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Trivy Binary Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'rootfs'
          scan-ref: 'target/${{ matrix.target }}/release/aegisnode'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Package release artifact & compute SHA-256
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/aegisnode dist/aegisnode
          tar -czvf "aegisnode-${VERSION}-${{ matrix.target }}.tar.gz" -C dist aegisnode
          sha256sum "aegisnode-${VERSION}-${{ matrix.target }}.tar.gz" > "aegisnode-${VERSION}-${{ matrix.target }}.tar.gz.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aegisnode-*-${{ matrix.target }}.tar.gz
            aegisnode-*-${{ matrix.target }}.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
