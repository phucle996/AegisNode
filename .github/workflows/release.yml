name: AegisNode Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build Frontend, Compile Single Binary & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web UI static assets
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Package single binary release tarball
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/release/aegisnode dist/aegisnode
          tar -czvf "aegisnode-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C dist aegisnode
          sha256sum "aegisnode-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" > "aegisnode-${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aegisnode-*-x86_64-unknown-linux-gnu.tar.gz
            aegisnode-*-x86_64-unknown-linux-gnu.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
