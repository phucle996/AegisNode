apiVersion: aegisnode.io/v1
kind: FirewallPolicy

metadata:
  name: invalid-port-policy
  id: policy-invalid-port-005

defaults:
  input: drop
  output: accept
  forward: drop

rules:
  - id: rule-invalid-port
    direction: input
    action: accept
    protocol: tcp
    destinationPorts:
      - 70000
